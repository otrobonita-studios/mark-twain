name: Sync RAG Memory

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual execution from the GitHub Actions UI

permissions:
  contents: write

jobs:
  sync-memory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history so we can push updates back
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('rag/data-collection/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache Hugging Face Models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-${{ hashFiles('rag/data-collection/TwainCorpus/embed_corpus.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 qdrant-client python-dotenv sentence-transformers internetarchive

      - name: Run RSS Crawler
        env:
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'ai@otrobonita.com' }}
        run: |
          python rag/data-collection/rss-crawler/scripts/rss_crawler.py \
            --config rag/data-collection/rss-crawler/feeds.json \
            --output-dir rag/data-collection/TwainCorpus/rss \
            --delay 1.5

      - name: Run Vector Embedder
        run: |
          python rag/data-collection/TwainCorpus/embed_corpus.py

      - name: Upload Vectors to Qdrant
        env:
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
        run: |
          python rag/data-collection/TwainCorpus/upload_vectors.py

      - name: Re-aggregate Corpus Index
        run: |
          python rag/data-collection/corpus-aggregator/scripts/aggregate_corpus.py \
            --corpus-dir rag/data-collection/TwainCorpus \
            --subject "Mark Twain" \
            --purpose "Unified search index"

      - name: Commit and Push State Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage newly crawled RSS text/HTML files and state tracker JSONs
          git add rag/data-collection/TwainCorpus/
          
          # Only commit and push if there are changes to prevent empty commit errors
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-sync RAG memory & crawled RSS data [skip ci]"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes in memory state files."
          fi
