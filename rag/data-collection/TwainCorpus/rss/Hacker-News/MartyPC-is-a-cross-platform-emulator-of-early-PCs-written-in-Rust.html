<body>
<!-- The WASM code will resize the canvas dynamically -->
<!-- the id is hardcoded in main.rs . so, make sure both match. -->

<!-- Initial screen with "Click to start" -->
<div class="start-overlay" id="start_screen">
<main aria-labelledby="system_select_title" class="start-launcher">
<div class="start-logo-wrapper">

</div>
<h1 class="start-title" id="system_select_title">Choose a System</h1>
<section aria-label="System selection" class="system-carousel">



</section>
<div class="system-details-panel" id="system_details_panel">
<div aria-live="polite" class="system-details">
<p class="system-name" id="selected_system_name">Loading systems…</p>

</div>
<div aria-hidden="true" class="system-options" data-visible="false" id="system_options">
<div aria-hidden="true" class="system-option" data-visible="false" id="video_card_option">
<label class="system-options-label" for="video_card_select">Video Card</label>
<select class="system-options-select" disabled="" id="video_card_select">
<option value="ibm_mda">MDA</option>
<option value="hercules">Hercules</option>
<option selected="" value="ibm_cga">CGA</option>
<option value="ibm_ega">EGA</option>
<option value="ibm_vga">VGA</option>
</select>
</div>
<label aria-hidden="true" class="system-option system-options-checkbox" data-visible="false" id="memory_sidecar_option">

<span class="system-options-label">Memory Sidecar</span>
</label>
<label aria-hidden="true" class="system-option system-options-checkbox" data-visible="false" id="adlib_option">

<span class="system-options-label">AdLib Card</span>
</label>
</div>
</div>
<!-- main.rs attaches the WASM startup handler to this element. -->
<button class="start-button" disabled="" id="start_logo" type="button">Loading systems…</button>
<p class="carousel-instructions">
<span class="arrow-instruction">Use the arrows or keyboard to rotate</span>
<span class="swipe-instruction">Swipe or tap the arrows to rotate</span>
</p>
</main>

</div>
<!-- the loading overlay will be removed in main.rs -->
<div aria-live="polite" class="loading-overlay" id="loading_text" role="status">
<div class="loading-content">

<p class="loading-label">
            Loading…
        </p>
</div>
</div>
<div aria-live="assertive" class="fatal-error-overlay" hidden="" id="fatal_error_screen" role="alert">
<div class="fatal-error-content">

<p class="initialization-error-message">
            MartyPC failed to initialize.See the developer console for details (Hit F12).
        </p>
</div>
</div>
<!-- Cloudflare Pages Analytics --><!-- Cloudflare Pages Analytics --></body>
