<body>
<!-- ============ 开机画面 ============ -->
<div class="boot" id="boot">
<div class="boot-logo">
<div class="boot-flag"></div>
<div class="boot-title">Microsoft<sup>®</sup> Windows<sup>®</sup> XP</div>
<div class="boot-sub">怀旧模拟版 · 2005</div>
</div>
<div class="boot-progress"><div class="boot-bar"></div></div>
</div>
<!-- ============ 登录界面 ============ -->
<div class="login hidden" id="login">
<div class="login-left">
<div class="login-brand">
<div class="boot-flag small"></div>
<div>windows<sup>xp</sup></div>
</div>
<div class="login-tip">要开始，请单击您的用户名</div>
</div>
<div class="login-right">
<div class="login-user" id="loginUser">
<div class="login-avatar">👤</div>
<div class="login-name">Administrator</div>
<div class="login-desc">怀念 2005 年的互联网</div>
</div>
</div>
</div>
<!-- ============ 桌面 ============ -->
<div class="desktop hidden" id="desktop">


<div id="buildStamp" style="position:absolute;right:8px;bottom:38px;color:rgba(255,255,255,.65);font-size:11px;text-shadow:1px 1px 1px rgba(0,0,0,.5);z-index:2;pointer-events:none;">v11 · 07-15</div>
<!-- 开始菜单 -->
<div class="start-menu hidden" id="startMenu">
<div class="sm-header">
<div class="sm-avatar">👤</div>
<div class="sm-user">Administrator</div>
</div>
<div class="sm-body">
<div class="sm-left">


<div class="sm-allprograms" id="smAllPrograms">所有程序 ▸</div>
</div>

</div>
<div class="sm-footer">
<div class="sm-foot-btn" id="smLogoff">⏻ 注销</div>
<div class="sm-foot-btn" id="smShutdown">⏻ 关闭计算机</div>
</div>
</div>
<!-- 任务栏 -->
<div class="taskbar" id="taskbar">
<button class="start-btn" id="startBtn"><span class="start-flag"></span>开始</button>


<div class="tray" id="tray">

<span class="clock" id="clock">12:00</span>
</div>
</div>
</div>
<!-- 关机画面 -->
<div class="shutdown hidden" id="shutdown"><div class="shutdown-text">正在保存设置…</div></div>


















</body>
