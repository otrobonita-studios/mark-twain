<body>
<main class="shell">

<section class="workspace">
<section aria-labelledby="testTitle" class="test-panel">
<div class="panel-head">
<div>
<p class="eyebrow">Terminal command typing</p>
<h1 id="testTitle">Test the speed of your terminal-fu</h1>
</div>
<div aria-live="polite" class="timer">
<span id="timeLeft">60</span>
<small>sec</small>
</div>
</div>
<div aria-label="Test controls" class="controls">
<div class="control-group">
<span class="control-label">Mode</span>

</div>
<div class="control-group">
<span class="control-label">Time</span>
<div class="segmented compact">
<button class="time-option" data-duration="30" type="button">30s</button>
<button class="time-option active" data-duration="60" type="button">60s</button>
<button class="time-option" data-duration="120" type="button">120s</button>
</div>
</div>
</div>
<div aria-label="Live metrics" class="metrics">
<div>
<span id="wpmValue">0</span>
<small>WPM</small>
</div>
<div>
<span id="accuracyValue">100</span>
<small>Accuracy</small>
</div>
<div>
<span id="commandValue">0</span>
<small>Commands</small>
</div>
<div>
<span id="mistakeValue">0</span>
<small>Mistakes</small>
</div>
</div>

<label class="typing-box">
<span class="typing-box-head">
<span id="inputLabel">Start typing to begin</span>
<span aria-live="polite" class="inline-timer"><span id="inlineTimeLeft">60</span>s</span>
</span>

</label>
</section>

</section>
</main>

</body>
