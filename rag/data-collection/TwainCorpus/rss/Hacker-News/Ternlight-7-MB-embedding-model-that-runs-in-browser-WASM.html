<body>
<main class="app">
<!-- ───────────────────────────────────────────────────────────────────
         Header — visible in both phases. Project hero + 3 spec cards +
         "this is just one example" framing for the search below.
         ─────────────────────────────────────────────────────────────────── -->

<!-- ───────────────────────────────────────────────────────────────────
         Phase 1 — indexing. Shown until the corpus is fully embedded.
         ─────────────────────────────────────────────────────────────────── -->
<section class="indexing-phase" id="indexing-phase">
<p class="indexing-status">
<span id="indexing-action">Loading the engine…</span>
</p>
<div class="progress">

</div>
<div class="indexing-stats">
<div class="stat">
<div class="stat-value" id="stat-count">0 / 0</div>
<div class="stat-label">CHUNKS</div>
</div>
<div class="stat stat-throughput">
<div class="stat-value" id="stat-tput">— <span class="stat-unit">emb/sec</span></div>
<div class="stat-label">ON YOUR CPU</div>
</div>
<div class="stat">
<div class="stat-value" id="stat-elapsed">0.0 <span class="stat-unit">s</span></div>
<div class="stat-label">ELAPSED</div>
</div>
</div>
</section>
<!-- ───────────────────────────────────────────────────────────────────
         Phase 2 — search. Two-column grid: results on left, info pane right.
         ─────────────────────────────────────────────────────────────────── -->
<div class="search-phase hidden" id="search-phase">
<section class="content">
<div class="search-row">
<span class="search-prefix">›</span>

<span class="badge" id="latency-badge">—</span>
</div>
<div class="try-queries">
<span class="try-label">ASK</span>
<button class="try-q" data-q="share state across components">share state across components</button>
<button class="try-q" data-q="skip a re-render">skip a re-render</button>
<button class="try-q" data-q="run code after render">run code after render</button>
<button class="try-q" data-q="avoid prop drilling">avoid prop drilling</button>
<button class="try-q" data-q="form input value">form input value</button>
</div>

</section>

</div>
</main>


<!-- Vercel Web Analytics (cookieless page views). The /_vercel/ route only
       exists on the deployed site — locally this 404s silently, harmless. -->


</body>
