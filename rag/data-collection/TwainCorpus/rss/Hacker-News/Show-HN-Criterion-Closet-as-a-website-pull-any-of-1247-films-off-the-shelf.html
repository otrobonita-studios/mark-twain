<body data-view="closet">
<!-- chrome: brand + view toggle + filters + Your Lists.
       On the wall it's a sticky top bar; in the closet it becomes a centered glass panel. -->
<div id="chrome-stage"><div id="chrome-cam">
<div class="chrome" id="chrome">
<div class="bar">
<div class="bar-l">
<span class="logo" id="brandLabel">THE CLOSET</span>
</div>

</div>
<div class="toolbar">

<button aria-expanded="false" class="filters-btn" id="filters-btn" type="button">Filters <span aria-hidden="true" class="fb-car">▾</span></button>

<label class="sort">Sort
        <select id="sort">
<option value="spine">Spine #</option>
<option value="spine-desc">Spine # ↓</option>
<option value="title">Title A–Z</option>
<option value="year">Year ↑</option>
<option value="year-desc">Year ↓</option>
</select>
</label>
</div>



<div class="chrome-foot">
<a aria-label="Buy me a coffee" class="chrome-coffee" href="https://buymeacoffee.com/oliievanss" id="chrome-coffee" rel="noopener" target="_blank">

<span>Buy me a coffee</span>
</a>
</div>
</div>
</div></div>
<main class="wall" id="wall">

</main>

<!-- The Closet: a full-viewport overlay shown in closet mode -->
<div class="closet-overlay" id="closet">

<div class="closet-prompt" id="closet-prompt"><b>Click</b>, then move the mouse to look · press <b>F</b> for the menu</div>
</div>
<div aria-hidden="true" class="closet-loader" id="closet-loader">
<div class="cl-brand">THE CLOSET</div>
<div class="cl-sub">Shelving the collection…</div>
</div>
<div class="esc-hint" id="esc-hint">Aim the crosshair at the menu &amp; click</div>

<!-- the pointer-lock "cursor", drawn in front of the doorway menu so you can see where you're aiming -->

<!-- mobile: a persistent List / Closet switch pinned top-right while you're in the closet. Display:none
       (and thus AT-hidden) on the List; it's the only switcher when shown (the in-panel one is hidden), so
       it must NOT be aria-hidden. -->

<!-- closet view: a vertical pill-stack top-left. Tap on mobile; on desktop the pointer's locked so the keycaps show the shortcuts. -->

<div aria-modal="true" class="overlay hidden" id="overlay" role="dialog">

</div>
<!-- in-page trailer player (YouTube embed); opened from the List card and from the closet via postMessage -->
<div aria-label="Trailer" aria-modal="true" class="trailer-modal" hidden="" id="trailer-modal" role="dialog">
<button aria-label="Close trailer" class="tm-close" id="tm-close">×</button>

</div>










<!-- Vercel Web Analytics (static-site script; counts page views once Web Analytics is enabled for the project) -->

</body>
