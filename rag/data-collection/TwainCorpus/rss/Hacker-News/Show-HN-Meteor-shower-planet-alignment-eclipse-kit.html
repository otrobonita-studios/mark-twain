<!-- Boot watchdog. Every push to main redeploys, and for ~7 minutes the
       CDN can hand out HTML whose hashed bundles are already gone — the app
       never mounts and the user sees a dead navy page that a refresh (same
       cached HTML) doesn't fix. This is the third time that bit us mid-test;
       with the Perseids link going out it would bite strangers instead.
       Inline and dependency-free ON PURPOSE: it must run when the bundle is
       exactly the thing that failed. main.tsx sets __LS_BOOTED; if that
       hasn't happened by the deadline, show an honest "updating" screen and
       retry with cache-busting on a backoff that outlives a deploy window.
       sessionStorage caps the loop; any successful boot resets it. -->
