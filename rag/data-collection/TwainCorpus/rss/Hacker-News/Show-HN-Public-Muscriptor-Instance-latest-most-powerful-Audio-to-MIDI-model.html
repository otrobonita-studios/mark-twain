<body>
<!-- React clears `#root` on its first render, so what is written inside it
         is seen only for the moment before the bundle mounts. That moment now
         holds a meter and nothing else.

         The prose that used to sit here was also what a crawler saw on the
         first pass, before Googlebot came back round to render the JavaScript.
         That job now falls entirely to `<title>`, `<meta name="description">`,
         and the JSON-LD block above — worth knowing if this page's search
         result ever looks thin. -->
<div id="root">
<main class="boot">
<div aria-label="Loading pianoify" class="boot-meter" role="status">










</div>
</main>
</div>
</body>
