<main class="layout" id="layout">
<section class="editor-pane" id="editor-pane">
<div class="pane-head">
<div class="pane-head-left">
<span class="pane-title">SQL schema</span>

</div>

</div>
<div class="editor-stack">
<pre aria-hidden="true" class="hl"></pre>

</div>
</section>

<section class="canvas-pane">

<button aria-label="Show SQL panel" class="reopen-sql" data-umami-event="show-sql" id="btn-open-sql" title="Show SQL panel">

<span>SQL</span>
</button>
<div class="empty-hint" id="empty">
<div class="empty-card">
<h2>Paste SQL, see the schema.</h2>
<p>Drop your <code>CREATE TABLE</code> statements on the left. Drag tables, scroll to zoom, double-click to rename, export when done.</p>
<button class="btn primary" data-umami-event="load-example-empty" id="btn-example2">Load example schema</button>
<p class="privacy">

            100% local — your schema never leaves your browser. No accounts, no uploads.
          </p>
</div>
</div>
<div class="tool-palette">
<button class="btn ghost tool" data-umami-event="add-note" id="tool-note" title="Add a sticky note">

<span>Note</span>
</button>
<button class="btn ghost tool" data-umami-event="add-group" id="tool-group" title="Add a group box">

<span>Group</span>
</button>
</div>
<div class="zoom-controls">
<button aria-label="Zoom out" class="btn ghost icon" id="zoom-out" title="Zoom out">−</button>
<button class="btn ghost" id="zoom-reset" title="Reset zoom">100%</button>
<button aria-label="Zoom in" class="btn ghost icon" id="zoom-in" title="Zoom in">+</button>
</div>
</section>
</main>
