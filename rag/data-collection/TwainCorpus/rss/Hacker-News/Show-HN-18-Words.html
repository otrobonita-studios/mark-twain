<body>
<!-- Welcome -->
<div class="screen" id="welcome" style="gap: 28px;">
<div>
<div aria-hidden="true" class="welcome-hourglass">⏳</div>
<h1>18 Words</h1>
<p class="welcome-instruction">Can you survive the 18 words challenge?</p>
</div>
<div class="welcome-actions">

<button class="btn btn-play" id="playBtn" onclick="playSelectedDay()">Play now</button>
</div>
</div>
<!-- Game -->
<div class="screen game-screen" id="game">



<button class="reveal-btn" id="revealBtn" onclick="revealLetter()">
            Reveal letter (<span class="reveal-count" id="revealCount">3</span>)
        </button>
</div>
<!-- Pause Modal -->
<div class="pause-overlay" id="pauseOverlay">
<h2>Paused</h2>
<div class="pause-buttons">
<button class="btn btn-primary" onclick="resumeGame()">Resume</button>
<button class="btn btn-secondary" onclick="restartGame()" style="margin-top: 0;">Restart</button>
</div>
</div>
<!-- Result -->
<div class="screen" id="result">




<div class="share-actions reveal-item" id="shareActions">
<button class="btn btn-share" id="shareBtn" onclick="shareScore()">Share score </button>
<button class="btn btn-challenge" id="challengeBtn" onclick="challengeFriend()">Challenge friend</button>
</div>
<!-- Stats row hidden for now (easy to re-enable later)
        <div id="resultStats" class="result-stats reveal-item">
            <div class="stat-item">
                <div class="stat-value" id="statDaysPlayed">0</div>
                <div class="stat-label">Days played</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statStreak">0</div>
                <div class="stat-label">Daily streak</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statAvg">0</div>
                <div class="stat-label">Average</div>
            </div>
        </div>
        -->

<div class="result-actions reveal-item" id="resultActions">
<button class="btn btn-secondary" id="practiceAgainBtn" onclick="startPracticeGame()" style="margin-top: 0; display: none;">Practice again</button>
<button class="btn btn-secondary" id="archiveBtn" onclick="showArchive()" style="margin-top: 0;">Play Archive</button>
<!-- <button id="practiceModeBtn" class="btn btn-secondary" style="margin-top: 0;" onclick="startPracticeGame()">Practice Mode</button> -->
</div>
<p class="feedback-line reveal-item" id="feedbackLine">Thanks for playing! You can <span class="feedback-link" onclick="openFeedbackModal()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openFeedbackModal();}" role="button" tabindex="0">send me some feedback</span>.</p>
</div>
<!-- Confetti overlay (perfect game) -->

<!-- Toast (keyboard hint, archive lock, etc.) -->

<!-- Archive Modal -->
<div class="modal" id="archiveModal">
<div class="modal-content">
<div class="modal-header">
<h2>Archive</h2>
<button class="close-modal" onclick="closeModal()">×</button>
</div>

</div>
</div>
<!-- Feedback Modal -->
<div class="modal" id="feedbackModal">
<div class="modal-content">
<div class="modal-header">
<h2>Send feedback</h2>
<button class="close-modal" onclick="closeModal()">×</button>
</div>

</div>
</div>

</body>
