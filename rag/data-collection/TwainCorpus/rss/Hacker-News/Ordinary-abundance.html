<p class="scene-kicker">The sitting room</p>
<p class="scene-text">It’s eight o’clock. The apartment is quiet, aside from the music playing softly over the speaker. It’s a playlist your friend made for you years ago. You send them a text to check in, then pick up a book, flick on the lamp, and settle into the chair to read.</p>
