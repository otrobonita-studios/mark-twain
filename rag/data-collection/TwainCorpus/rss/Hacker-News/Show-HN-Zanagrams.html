<body>
<!--
    Visible copy is filled at runtime from assets/i18n.js (keyed by data-i18n).
    Body/modal elements are intentionally left empty here so i18n.js is the single
    source of truth - the only real text kept in this file is the <title> and the
    <h1> app name (the SEO/share-preview bits that no-JS scrapers read).
  -->
<div class="app">

<div class="subtitle">

</div>
<div class="board-wrap">
<div id="board">


</div>
</div>

<div class="complete-screen" id="complete">
<div class="c-line c-time">
<span class="c-time-val" id="cTime">00:00</span>
</div>

<div class="c-line c-actions">


</div>



</div>
</div>
<!-- Puzzle book modal -->
<div class="overlay" id="bookOverlay">
<div class="modal">
<div class="modal-head">
<button aria-label="Back to menu" class="modal-back" data-back="bookOverlay" data-i18n-aria-label="backToMenu">‹</button>

<button class="modal-close" data-close="bookOverlay">×</button>
</div>

<div id="bookList"></div>
</div>
</div>
<!-- Definitions modal -->
<div class="overlay" id="defOverlay">
<div class="modal">
<div class="modal-head">

<button class="modal-close" data-close="defOverlay">×</button>
</div>

</div>
</div>
<!-- Menu modal -->
<div class="overlay" id="menuOverlay">
<div class="modal">
<div class="modal-head">

<button class="modal-close" data-close="menuOverlay">×</button>
</div>
<div class="menu-list">
<button class="menu-item" id="menuHow"><span class="menu-arrow">›</span></button>
<button class="menu-item" id="menuControls"><span class="menu-arrow">›</span></button>
<button class="menu-item" id="menuBook"><span class="menu-arrow">›</span></button>
<button class="menu-item" id="menuLanguage"><span class="menu-lang-current"><span class="menu-arrow">›</span></span></button>
<div class="menu-item menu-toggle" id="menuDark" role="switch" tabindex="0"><span class="switch" id="darkSwitch"></span></div>
<button class="menu-item" id="menuFeedback"><span class="menu-arrow">›</span></button>
<button class="menu-item" id="menuLegal"><span class="menu-arrow">›</span></button>
</div>
</div>
</div>
<!-- Language modal -->
<div class="overlay" id="langOverlay">
<div class="modal">
<div class="modal-head">
<button aria-label="Back to menu" class="modal-back" data-back="langOverlay" data-i18n-aria-label="backToMenu">‹</button>

<button class="modal-close" data-close="langOverlay">×</button>
</div>

</div>
</div>
<!-- How to play modal -->
<div class="overlay" id="howOverlay">
<div class="modal">
<div class="modal-head">
<button aria-label="Back to menu" class="modal-back" data-back="howOverlay" data-i18n-aria-label="backToMenu">‹</button>

<button class="modal-close" data-close="howOverlay">×</button>
</div>
<div class="how-body">
<div class="how-section">

</div>
</div>
</div>
</div>
<!-- Controls modal -->
<div class="overlay" id="controlsOverlay">
<div class="modal">
<div class="modal-head">
<button aria-label="Back to menu" class="modal-back" data-back="controlsOverlay" data-i18n-aria-label="backToMenu">‹</button>

<button class="modal-close" data-close="controlsOverlay">×</button>
</div>
<div class="how-body">
<div class="how-section is-controls">

</div>
</div>
</div>
</div>
<!-- First bonus word intro modal (shown once, ever) -->
<div class="overlay" id="bonusOverlay">
<div class="modal">
<div class="modal-head">

</div>


</div>
</div>
<!-- Feedback modal -->
<div class="overlay" id="feedbackOverlay">
<div class="modal">
<div class="modal-head">
<button aria-label="Back to menu" class="modal-back" data-back="feedbackOverlay" data-i18n-aria-label="backToMenu">‹</button>

<button class="modal-close" data-close="feedbackOverlay">×</button>
</div>

</div>
</div>
<!-- Privacy & terms modal -->
<div class="overlay" id="legalOverlay">
<div class="modal">
<div class="modal-head">
<button aria-label="Back to menu" class="modal-back" data-back="legalOverlay" data-i18n-aria-label="backToMenu">‹</button>

<button class="modal-close" data-close="legalOverlay">×</button>
</div>

</div>
</div>



</body>
