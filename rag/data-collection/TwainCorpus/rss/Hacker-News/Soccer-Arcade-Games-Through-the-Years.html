<div class="entry-content">
<p>The FIFA World Cup 2026 games are here, and where many of our readers are into the sport, it’s time to provide an updated look at soccer/football arcade games that have popped up over the years. <a href="https://arcadeheroes.com/2014/06/11/world-cup-2014-soccer-arcade-games/">We did do an article on this way back in 2014</a>, but aside from some outdated information, and there not being enough new releases in the genre since, it didn’t warrant a post every four years. There is however enough to add to it now, so we have adapted that 2014 post with some rewrites, additions, and updates for a fresh look at this niche for the business.</p>
<p>My principal experience with the sport came through my years of living in Brazil, which included being there when they won the World Cup in 2002. I wasn’t anywhere near a TV when it happened but boy did I know about it – I’ve never seen such a non-stop party since, with fireworks, horns honking, and hollering, and it just went on for two or three days. It was pretty wild, and stuff like <em>Carnival</em> couldn’t touch it (in fact, where I lived, most people left town for <em>Carnival</em>, so things were mellow when it was that time of year – Rio’s generally where most of the usual partying is). Fortunately there were no riots or violence that I can recall, at least in the place I was living in at the time.</p>
<p>Anyways, onto the games:</p>
<h3 style="text-align: center; color: white; background-color: black; border: 5px lime outset;">Before Video Games</h3>
<p>While our main focus here is on the video game, the pre-video era deserves at least a brief mention. Pinball covers this ground well, with a flipperless pingame that was aptly called <em><a href="https://www.ipdb.org/machine.cgi?id=4272">Soccer</a></em> by G/M. Laboratories. The first time a flipper pin would apply the theme was with Williams’ 1958 release, <a href="https://www.ipdb.org/machine.cgi?id=5188"><em>Soccer</em> <em>Kick Off</em></a>.</p>
<p>In the 1950s, companies like <a href="https://www.rene-pierre.fr/rene-pierre-company-manufacturer-of-football-tables-and-pool-tables/">René Pierre</a> would develop foosball, also known as table soccer. Many companies have tried their hand at that game, although RP is one of the longest lasting creators of the game.</p>
<p>A head-to-head pin by the name of <em><a href="https://www.ipdb.org/machine.cgi?id=4976">Star Foot</a></em> would come along in 1964, where the flippers had figurines of the team players integrated into them, almost like table soccer/foosball. Developed by a company called Satem out of France, this is the only product they have listed on the IPDB. I don’t know if it was the first head-to-head pinball game ever made, but almost all other soccer-themed games released between this and 1975 were also head-to-head games. That would also include a rare example of pinball to come out of Taito in 1967 called <a href="https://www.ipdb.org/machine.cgi?id=4133"><em>Crown Soccer Special</em></a>. Sega then released <em><a href="https://www.arcade-history.com/game/36748/soccer">Soccer</a></em>, which was kind of a cross between a foosball &amp; head-to-head pinball game. Sega would also put out the unique <a href="https://www.arcade-history.com/game/14489/motopolo"><em>Motopolo</em></a>, which was like soccer with motorcycles.</p>
<p></p>
<h3 style="text-align: center; color: black; background-color: snow; border: 5px lime outset;">The 1970s</h3>
<p style="text-align: center;"><em>As a note, I am working hard on a history &amp; trivia book about arcade games from the 1970s – kind of like this post, but expanded to most everything released that decade in terms of video games and pinball. Stay tuned for news on that, but I hope to have it </em><em>ready before the Summer is over.</em></p>
<p>At the beginning of our industry in the 1970s, the limitations of TTL-chip technology meant that there wasn’t a huge variety in the types of games that were made available, with many falling under the “ball &amp; paddle” genre.</p>
<p><em></em>Tennis was how these B&amp;P games were often billed, but a few times companies would re-brand these with highly ‘creative’ names like <em><a href="https://www.arcade-history.com/game/4755/soccer-deluxe-model">Soccer</a></em> (Taito, Nov. 1973), <em><a href="http://www.arcade-museum.com/game_detail.php?game_id=9603" rel="noopener" target="_blank">Soccer</a> </em>(Ramtek, 1973) or <em><a href="https://www.arcade-history.com/game/4315/super-soccer">Super Soccer</a></em> (Allied, Nov. 1973). The name got the point across, I suppose. A month later, Taito would adapt their effort into a 4-player version called <em><a href="https://www.arcade-history.com/game/4753/davis-cup">Davis Cup</a>. </em>Both were the first video games designed by Tomohiro Nishikado, who would later create <em>Space Invaders</em>.</p>
<p>Sega for their part would make one of their ball &amp; paddle games soccer themed and a little different. 1974’s <a href="https://www.arcade-museum.com/Videogame/goal-kick"><em>Goal Kick</em></a> would be the first adaptation of the penalty kick (which has been all the rage with most modern soccer arcade games) into video games, by turning the your typical Pong setting on it’s side and making it vertical. This would make it a precursor to the likes of Breakout, but it’s unknown if this one ever found it’s way to the US to have any direct influence like that, although the cabinet itself (pictured) does have English on it instead of Japanese – while the coin chutes clearly mention Yen, and the flyer is Japanese only. This style of cabinet was typical of Sega at the time.</p>
<p>It wasn’t <em>Virtua Striker</em> or <em>WCCF</em>, but hey, they had to start somewhere with the tech of the time.</p>
<p>Atari was also plenty busy with cranking out ball &amp; paddle games among a few others, but it would be their French division who would take <em>Pong Doubles</em> and turn it into <em><a href="https://www.arcade-museum.com/Videogame/coupe-du-monde">Coupe Du Monde</a></em>/<em>Coupe Du Franc/<a href="https://www.arcade-museum.com/Videogame/world-cup-football">World Cup Football</a></em> (the name depended on the market that they were targeting), then later on there was <a href="https://www.arcade-history.com/game/3763/goal/4"><em>Goal IV</em></a>, which was a little closer to digital foosball. Steve Jobs reportedly did some assistance on these as a technician (which is mentioned a few times in Atari Inc. – Business Is Fun).</p>
<p></p>
<p>Speaking of digital foosball, Allied Leisure would release <a href="https://www.arcade-museum.com/Videogame/futsball"><em>Futsball</em></a> in 1975, which was the first time a cabinet would be more representative of a foosball table. That’s all Allied would bother with for the sport.</p>
<p>Once technological improvements such as the CPU and color TV gave the world an unusual soccer game by the name of <a href="https://www.arcade-history.com/game/392/car-polo"><em>Car Polo</em></a> (Exidy, 1977). For you younguns out there, this was <em>Rocket League</em> done 1970s style. One of the few color games released that year (yes, these did exist before <em>Galaxian</em> came along, despite what you might have read in some game trivia bits), it was soccer with cars, for up to four players. The concept of cars playing soccer was revisited in the arcade some time later with <a href="https://arcadeheroes.com/2008/07/24/konamis-gti-club-cabinet-revealed/" rel="noopener" target="_blank">Konami’s <em>GTI Club Supermini Festa</em></a>, which had a limited Western release.</p>
<p></p>
<p>Sega was next up with a ball-kicking title, called <a href="https://www.arcade-history.com/game/26094/world-cup"><em>World Cup</em></a> and released in the Spring of 1978. Licensed to Exidy for a US release, this was the first arcade game to use a trackball (Exidy would refer to it as a “palmball”). The cabinets have different artwork but the software is the same. This was Sega’s first digital interpretation of the sport, but it certainly wouldn’t be their last.</p>
<p></p>
<p>Atari would fire back with their own <em>Atari Soccer</em> in 1979, which also used their “trakball”, and came in a cocktail cabinet for up to four players. This used the similar scrolling tech that they had done for <em>Atari Football</em> the year prior, but came with slightly more detailed graphics as the players had animated bodies along with symbols (the latter to help people identify their player, given that it was a B&amp;W game).</p>
<p></p>
<p>For pinball, there were a few titles to feature the sport released during this decade: <em>Soccer</em> &amp; <em><a href="https://www.ipdb.org/machine.cgi?id=2443">Super Soccer</a></em> by Gottlieb in 1975 (which included a backbox mechanism); <a href="https://www.ipdb.org/machine.cgi?id=2507"><em>Team One</em></a> by Gottlieb in 1978 (which was rebranded for a couple of distributors for release in Europe); Bally’s <a href="https://www.ipdb.org/machine.cgi?id=1365"><em>Kick Off</em> </a>in 1977 (which was their last EM game); then finally Williams produced <em><a href="https://www.ipdb.org/machine.cgi?id=2810">World Cup</a></em> in 1978 (which was their first game with digital sounds).</p>
<h3 style="text-align: center; color: white; background-color: black; border: 5px lime outset;">The 1980s</h3>
<p>The 1980s gave us many classics to enjoy, but soccer games from the time don’t tend to dominate many discussions among the games of the era. I’d call all of these either somewhat to very rare – in all my arcade travels and ownership over the years, I have never come across any of these titles to be discussed in person (this includes CAX/PRGE/huge private collections). Perhaps this is more in the US where they just never sold well, and it’s easier to come across them in Europe/Asia/Latin America. But it’s also no secret that soccer just isn’t the biggest sport here, especially where you have so many others to compete with. I never once saw anyone playing baseball or American football in Brazil (basketball only twice), so this isn’t exactly a surprise.</p>
<p>Between <em>Atari Soccer</em> and the next game, fans of the sport didn’t have much to look for even if you were overseas, although the next time that it would show up, it was quite a difference in graphics and gameplay. I am a little surprised that Atari didn’t adapt their Atari 2600 game, <a href="https://atariage.com/software_page.php?SoftwareLabelID=346"><em>Pele’s Soccer</em></a>, into an arcade version, at least for an overseas release. On a pointless anecdote, I did once visit Pelé’s hometown of Três Coraçoes and saw his statue there, but I’m not sure what happened to the photo I took in front of it.</p>
<p>Anyways…</p>
<p>1983 gave the arcade world two joystick-controlled games: <em><a href="http://www.arcade-museum.com/game_detail.php?game_id=7728" rel="noopener" target="_blank">Exciting Soccer</a></em> (Alpha Denshi) and <a href="https://www.arcade-history.com/game/412/pro-soccer-model-dt-133"><em>Pro Soccer</em></a> (Data East). Exciting Soccer came first, but they are similar to each other, setting the tone for soccer games in the future with selectable teams based on the country, indicators to show ball possession and target and some actual soccer rules. <em>Pro Soccer</em> would be a little more on the technical side than ES, also with a radar feature to show player positions on the field that were outside of the game camera. These were also the first “proper” arcade soccer games in color (<em>Car Polo</em> wasn’t<em> technically</em> soccer). Alpha Denshi would release <a href="https://www.arcade-history.com/game/772/exciting-soccer-ii"><em>Exciting Soccer II</em></a> in 1985, but it was almost the same game aside from a team change and different music; <em>Fighting Soccer</em> released in 1988 by SNK would kind of be like a greatly enhanced version of the series.</p>
<p></p>
<p>At the end of the 1980s, Arcadia Systems would also follow this formula with <em>World Trophy Soccer</em> (1989), although this added a behind-the-goalie view that allowed you to try and block a shot.</p>
<p>Tecmo is often remembered from their arcade titles like <em>Ninja Gaiden</em> or <em>Tecmo Bowl,</em> but there was also <em><a href="https://www.arcade-history.com/game/2857/tehkan-world-cup">Tekhan World Cup,</a></em> which kicked off a franchise of soccer pieces. The first entry used trackball controllers, improved physics &amp; graphics over the other aforementioned games, also putting it into a cocktail cabinet.  Tecmo would release several sequels to this, starting with <em><a href="https://www.arcade-history.com/game/2847/tecmo-world-cup-90">Tecmo World Cup ’90</a> </em>in 1989, then doing a few on the Neo Geo MVS, the 1998 version for Sega’s ST-V system that took the series into 3D to compete with Sega’s <em>Virtua Striker</em>, and finally <em>Tecmo World Cup Millennium</em> that was released in 2000.</p>
<p></p>
<p>Quite a few soccer games from the mid-80s onwards would go back to a horizontal scrolling view of the playfield instead of the vertical one. This would include Universal’s last video game, <a href="https://www.arcade-history.com/game/1186/indoor-soccer"><em>Indoor Soccer</em></a> (1985), which also added slide kicks; Nintendo’s <em><a href="https://www.arcade-history.com/game/3114/vs.-soccer">Vs. Soccer</a></em> in 1985/86 for their Vs. system, while over at Sega, they had <a href="https://www.arcade-museum.com/Videogame/world-championship-soccer"><em>World Championship Soccer</em></a> (1989) for their <a href="https://system16.com/hardware.php?id=706&amp;page=6">Mega-Tech platform</a>; Jaelco’s <em><a href="https://www.arcade-museum.com/Videogame/kick-off">Kick Off</a></em> (1988); the aforementioned <em>Tecmo World Cup ’90; </em>East Technology’s<em> <a href="https://www.arcade-museum.com/Videogame/last-striker">Last Striker </a></em>(which also pitted boys vs girls), and Taito’s <a href="https://www.arcade-museum.com/Videogame/kick-and-run"><em>Kick And Run</em></a> (1986)</p>
<p>Despite the cartoony look of the graphics, <em>Kick And Run</em> gave soccer fans something a little closer to the real thing at the arcade. It combined elements of soccer games from the previous couple of years, fine tuning things like the isometric scrolling camera, player animations and movements which would become very common in soccer games down the road. This is also notable for being the first soccer game to use foot pedals for activating the kicks; it also returned to the four player format (<a href="https://archive.org/details/play-meter-volume-12-number-20-november-1986-raw-scans/Play%20Meter%20-%20Volume%2012%2C%20Number%2020%20-%20November%201986/page/72/">which was partly due to <em>Gauntlet’s</em> influence</a>, which you can also see in the shape of the control panel). Taito put a lot of faith into this one, going as far as making <a href="https://flyers.arcade-museum.com/videogames/show/4460">a whole booklet to promote it</a>, but have you ever come across this one?</p>
<p><a href="https://i0.wp.com/arcadeheroes.com/wp-content/uploads/2014/06/kickandrun.jpg" title="kickandrun"></a></p>
<p>While a lot of soccer games try to recreate the actual game in some form, sometimes they go off in a totally different direction. That was the case with Merit/Data East’s <a href="https://www.arcade-museum.com/Videogame/free-kick"><em>Free Kick</em></a> where they attempted to combine soccer with <em>Arkanoid</em>, which was hot at the time in 1987. Perhaps applying this kind of gameplay to the plethora of penalty kick redemption games out there would make those more exciting, or at least a little different from the norm.</p>
<p></p>
<h3 style="text-align: center; color: black; background-color: snow; border: 5px lime outset;">The 1990s</h3>
<p>Now we get to what is perhaps the Golden Age of the Arcade Soccer game, as we would see the most releases of games focused on the sport during this time. Sure, part of that was helped by systems like the SNK Neo Geo MVS, but not all of these titles we’ll discuss were MVS games either.</p>
<p>Since that system has been brought up, let’s cover all of the titles that we brought to SNK’s signature 1990s platform.</p>
<ul>
<li><em><a href="https://www.arcade-museum.com/Videogame/soccer-brawl"> Soccer Brawl</a></em> (1992)</li>
<li><em>Super Sidekicks</em> series (1/2/3/Ultimate 11; 1992-1996)</li>
<li><a href="https://www.arcade-history.com/game/971/goal-goal-goal"><em> Goal! Goal! Goal!</em> </a>(Visco, 1995)</li>
<li><em><a href="https://www.arcade-museum.com/Videogame/pleasure-goal-5-on-5-mini-soccer">Pleasuregoal / Futsal 5-on-5 Mini Soccer</a></em> (Saurus, 1996)</li>
<li><em><a href="https://www.arcade-museum.com/Videogame/tecmo-world-soccer-96">Tecmo World Soccer ’96</a></em> (SNK/Tecmo)</li>
<li><a href="https://www.arcade-museum.com/Videogame/neogeo-cup-98-the-road-to-the-victory"><em>NeoGeo Cup ’98</em></a> (SNK, 1998)</li>
</ul>
<p>While you’ll have to comment below on which of these is the best, I’ve owned <a href="https://www.arcade-history.com/game/3016/tokuten-oh-honoo-no-libero-model-ngm-215"><em>The Ultimate 11: SNK Football Championship</em></a> for several years, and aside from it being the only soccer video arcade piece I’ve owned, it’s one of those games that helps the MVS stand out as one of my best retro earners. Having an HD remaster of that or <em>Neo Geo Cup ’98</em> right now for the WC on exA-Arcadia would’ve been a nice release.</p>
<p>While games like<em> Tecmo World Cup ’90</em> certainly held influence over these types of games, Taito would launch a new series in 1991 that would in turn become a strong influence for pretty much all of the other soccer games released from there on out: <a href="https://www.arcade-history.com/game/1095/hattrick-hero"><em>Hat Trick Hero/Football Champ</em></a>. Thanks to the superior graphics tech of the time (using Taito’s M68k based <a href="https://system16.com/hardware.php?id=662&amp;gid=1669#1669">F1 system</a>), this one featured scaling graphics, while really leaning into the personality of a real match by ticking the realism up a notch or two. Players were allowed to kick, punch or grab their opponents to take control of the ball; if the ref doesn’t see it, then you’re good to go.  I also think this is the first soccer arcade game where it made a big celebratory deal out of getting a goal, showing the coach’s reactions to goals and having the player run along in front of the crowd as though they had just conquered the world.</p>
<p></p>
<p>Taito would keep this series going through 1996, with the first sequel taking a jump into the 2.5D realm, which is where the series stayed through <em>HTH/Football Champ ’95</em>. Each time, the animations and realism would get better, and this is one of the better places to start if you’re looking for an arcade soccer series to get into. The last time they gave it some love was in 1996 with <a href="https://www.arcade-history.com/game/2719/super-football-champ"><em>Super Football Champ</em></a>, the only entry of the series in full 3D.</p>
<p><em>Football Champ</em> had a heavy influence on other soccer games through the 1990s, although in part that’s due to the fact that Western devs mostly would ignore the sport. There were exceptions, like Leland’s 1990 release, <a href="https://www.arcade-museum.com/Videogame/world-soccer-finals"><em>World Soccer Finals</em></a> or Art &amp; Magic’s unique <a href="https://www.arcade-history.com/game/2636/stone-ball"><em>Stone Ball</em></a> (which was essentially caveman soccer). For the most part though, Japan would carry the sport through coin-op.</p>
<p>For a few of the one or two-offs, Seibu Kaihatsu had <a href="https://www.arcade-museum.com/Videogame/seibu-cup-soccer"><em>Seibu Cup Soccer</em></a> (1991) and <a href="https://www.arcade-museum.com/Videogame/olympic-soccer-92"><em>Olympic Soccer ’92</em></a>; one of Nintendo’s last coin-op releases was <a href="https://www.arcade-history.com/game/1851/super-soccer"><em>Super Soccer</em></a>, for the Nintendo Super System (an adjusted port of the SNES version), whereas on Sega’s comparable multi-game, <a href="https://system16.com/hardware.php?id=707">Genesis/Mega Drive-based platform</a>, Tecmo would release <a href="https://www.arcade-history.com/game/3315/tecmo-world-cup-model-04"><em>Tecmo World Cup</em></a> in 1992. In 1994, football-loving Tecmo would also release <em><a href="https://www.arcade-museum.com/Videogame/tecmo-v-goal-soccer">Tecmo V Goal Soccer</a></em>. There was also <a href="https://www.arcade-history.com/game/244/big-striker"><em>Big Striker</em></a> from Jaelco in 1992, <a href="https://www.arcade-history.com/game/1002/grand-striker-human-cup"><em>Grand Striker Human Cup </em></a>&amp; <a href="https://www.arcade-history.com/game/1003/grand-striker-2">a sequel</a> from Human in 1993 &amp; 1996, respectively; Data East would dabble one last time in the sport with <a href="https://www.arcade-museum.com/Videogame/dream-soccer-94"><em>Dream Soccer ’94</em> </a>(which allowed players to knock cameraman on the sidelines over); while Namco would also only do one, <a href="https://www.arcade-museum.com/Videogame/j-league-soccer-v-shoot"><em>J-League Soccer V-Shoot</em></a>; then for those wanting to play something off of the pitch and in the streets, there was SunA’s <a href="https://www.arcade-museum.com/Videogame/back-street-soccer"><em>Back Street Soccer</em></a> in 1996 (which had you selecting countries to play as instead of something like states or made-up teams). Capcom’s only soccer arcade game would come in 1997 as a part for the <a href="https://www.arcade-history.com/game/380/capcom-sports-club-green-board"><em>Capcom Sports Club</em></a>; Seta would also have a single footballing piece, a 3D style one in 1998 called <em><a href="https://www.arcade-history.com/game/3859/eleven-beat-world-tournament">Eleven Beat World Tournament</a>.</em></p>
<p>One very interesting one-off came from Gaelco in 1999 called <em><a href="https://www.arcade-history.com/game/4860/football-power">Football Power</a></em>. This would have been just another 3D soccer game. but they used that arcade hardware advantage, by providing a real, “3-axis motion” ball mechanism at the player’s feet to kick for when you wanted to do that in-game. That would be far more satisfying than pressing a button, although it comes with the drawback of a type of controller that will become victim to decay far sooner than your typical controls. <a href="https://www.arcade-history.com/game/4244/gaelco-football">Galeco released a sequel to this with redesigned hardware in 2002.</a></p>
<p></p>
<p>Konami had completely ignored the sport, up until <em>Premier Soccer</em> in 1993. It wasn’t an impressive entry, same with Ultra Sports/Five By Five Soccer, which was one of two options made available in a cocktail cabinet for bars. 1995 also saw <em>Soccer Superstars, </em>which was kind of a response to a Sega soccer game we’ll mention here soon. You could also say that was like Taito’s <em>Football Champ</em>, but with the camera behind the goals instead of from the side. I think it might have <a href="https://system16.com/hardware.php?id=577&amp;gid=655#655">originally been intended as a sequel to <em>Premier Soccer</em></a>, although I can’t confirm that for certain. A year later they’d do <em>Versus Net Soccer</em> which was kind of an improvement to <em>Soccer Superstars</em>, using pre-rendered graphics instead of hand-drawn, and allowing players to chose the camera’s angle (“top” or side view). Then, they would kick off a proper 3D football game in 1998 with <a href="https://www.youtube.com/watch?v=bOerwTxLncA"><em>Heat of Eleven 1998</em></a>, which ran on the fabled 3DO M2 board.</p>
<p>Before we get to Sega, it’s worth noting another single exception that would influence arcade redemption &amp; videmption gaming alike up to today, with GlobalVR’s <em>Kick-It!, <a href="https://www.arcade-history.com/game/11409/kick-it-pro">Kick-It Pro</a></em> and later <em>Kick-It Jr.</em> games. First released in 1997, this made it all about the penalty kick, where you’d kick a tethered soccer ball into the cabinet, which would sense the angle of the ball and translate that into the game. A 3D goalie would attempt to block your shots. The FEC I worked at as a teen had a Jr. model, but I remember it not being entirely precise on the physical-to-virtual translation of the ball. Maybe it just wasn’t calibrated properly much of the time. Either way, recent releases from companies like ICE and JET Games USA have titles which still use the basic principle behind this one, with their own ways at handling the ball (w/o the rope). Others have had their takes on the idea too.</p>
<p>All right, now it’s time we arrived at Sega. They hadn’t ignored soccer like Konami had, although with all sorts of hits occupying their roster in the late 1980s &amp; early 1990s, it wasn’t exactly at the top of their list. That changed with their own kind of <em>Football Champ</em> game in 1994 with <em><a href="https://www.arcade-museum.com/Videogame/super-visual-football-european-sega-cup">Super Visual Football Sega Cup</a>.</em> As mentioned, this had the camera angle from above and more behind the goal, and you can see where Konami’s Soccer Superstars was very much like it, but I’d hand the edge to Sega on the graphics and gameplay. That seems to be a taste of what was to come…</p>
<p></p>
<p>Yes, that would be <a href="https://www.arcade-history.com/game/3331/virtua-striker"><em>Virtua Striker</em></a> in 1995. Neither the first nor the last of Sega’s “Virtua” series, everyone knew that if that title was put on the front, that it was going to be a full 3D game. Released in May 1995, it would be the first true 3D soccer game, with fully textured and animated players. While the fans in the stands were a flat texture, they’d wave country flags too. A small radar at the bottom allowed you to see the view of the whole field, although if you’re like me, you never notice that while in the middle of the action. Like almost all of the other games on this post, it was controlled using a joystick &amp; buttons.</p>
<p>Only this and <em><a href="https://www.arcade-history.com/game/3755/virtua-striker-2-version-99">Virtua Striker 2</a></em> would be released in the 1990s, but this did create a franchise that would last until 2006 with <a href="https://www.arcade-history.com/game/4954/virtua-striker-4-ver.-2006-model-gdt-0020"><em>Virtua Striker 4</em></a>, which ran on <a href="https://system16.com/hardware.php?id=728&amp;page=2#2227">Sega, Nintendo and Namco’s Triforce hardware</a>. This was technically VS5, as Sega had also released <a href="https://www.arcade-history.com/game/3929/virtua-striker-2002-model-gdt-0001"><em>Virtua Striker 2002 Edition</em></a> to celebrate the World Cup being held in Japan &amp; South Korea that year. Each instance improved the graphics, although by what I can gather, the main complaints with the sequels were how the ‘reffing’ or penalties were handled. Not being an expert on these ones, fans out there will have to chime in on which of the various editions is considered to be the best.</p>
<p></p>
<p>Granted, nothing is preventing Sega from going back to the franchise, aside from sales projections. I am surprised that they haven’t given it a shot though, as I’d have to imagine that a modern VS would sell better than <em>Virtua Tennis 4</em> did (assuming it was good).</p>
<p>Don’t worry, I didn’t forget about pinball, although there isn’t a whole lot to talk about (given that we’re 3400+ words into this already, my hands aren’t complaining). An Italian company called Mr. Game would produce <em><a href="https://www.ipdb.org/machine.cgi?id=3603">World Cup ’90</a></em> in 1990 itself, although I have a hunch that it’s fairly rare to find outside of Europe. It had a color monitor in the backbox though (looks like one of those tiny CRTs that used to be a thing), and a small red LED or DMD-like display. This might have been a first on both of those items?</p>
<p>In 1994, Premier/Gottlieb brazenly called their <a href="https://www.ipdb.org/machine.cgi?id=2808"><em>World Challenge Soccer</em></a> the “game of the decade”, although after looking at how my Addams Family still earns 30+ years later, I’d press X for doubt on that one. I also don’t see anything particularly special on the playfield. The same month that was released, Midway would ship <em><a href="https://www.ipdb.org/machine.cgi?id=2811">World Cup Soccer</a></em>, which ended up selling about 8x as many units as Premier’s game. It just had a better playfield and features, which included a magna-save with the goalie. A couple of years later, Capcom would release <a href="https://www.ipdb.org/machine.cgi?id=3945"><em>Flipper Football</em></a>, which had the unusual feature of putting the DMD under the glass; underneath that, it had drop targets.</p>
<p></p>
<h3 style="text-align: center; color: white; background-color: black; border: 5px lime outset;">The 2000s</h3>
<p>We’ve finally arrived at our current century, although despite the graphics looking better than ever, and cabinets becoming more like simulators, the industry experienced a downturn from 2001-04, which led to a reduction in the number of releases across the board, and more of a focus on redemption. That said, there were still some video titles, including the <em>Virtua Strikers</em> and Gaelco’s <em>Football Power</em> sequel, which I won’t cover a second time.</p>
<p>Namco for their part did produce a second soccer game that was released in Japan in 2000 on Sega’s NAOMI hardware, called <em><a href="https://www.arcade-history.com/game/4129/world-kicks">World Kicks</a></em>. It used a similar approach to Gaelco’s <em>Football Power</em>, using the soccer ball kicking controller, just in a different way (no springs on this one). It also would be the first title among these games to support up to four players in a while, as most we’ve talked about in the 1990s only offered 1-2. This had a fun little Easter Egg you could do that would <a href="https://www.youtube.com/watch?v=LMITGBvqQKw">unlock Namco’s obscurish mascot character Klonoa</a>. UNIS would draw from this one almost twenty years later, but we’ll get to that in a bit.</p>
<p></p>
<p>While Sega was busy with <em>Virtua Striker</em>, they did also launch a multi-sport mini-game compilation in December 2000 called <a href="https://www.arcade-history.com/game/4084/sports-jam-model-gds-0003"><em>Sports Jam</em></a>. It featured events from eight different sports where you’d play a mini-game. From soccer, it only features the penalty kick, as you’d expect from anything mini-game related to the sport.</p>
<p>In 2002, both Sega and Konami launched titles that would see multiple versions/sequels down the road, with both mainly sticking to Asia &amp; Europe since interest just wasn’t there in North America. Sega made the <a href="https://www.arcade-history.com/game/30044/world-club-champion-football-serie-a-2001-2002"><em>World Club Champion Football</em></a> (WCCF) series, which was among the very first card collecting/card controlled games that would hit the market. Cards representing real players were placed on a large reader surface that represented the football pitch, and where you would place the cards would assign that soccer player to that point. That way customers could not only collect cards, but create teams based upon their attributes that you could switch around. Setups like that have primarily only found success in Japan although some versions of WCCF have received some support in Europe.</p>
<p></p>
<p>This operated with several versions between 2001-2018, though only the first few saw any action out West due to it being on the expensive side for most operators. Then in 2019, <a href="https://arcadeheroes.com/2019/01/29/jaepo-2019-wrap-up-new-arcade-games-for-japan-the-world/">Sega revamped the series with <em>WCCF Footista</em></a>, but that would only last through 2021, with the game being sunsetted in 2022. Could they return to it someday? Who knows…</p>
<p></p>
<p>Apparently unsatisfied with the performance of their original games in arcades through the 1990s, Konami’s <a href="https://www.arcade-history.com/game/4158/world-soccer-winning-eleven-arcade-game-style"><em>Winning Eleven / Pro Evolution Soccer Arcade</em></a> took the PlayStation home console version, and adapted it enough for arcade play. Some versions allow you to plug in a PS2 controller to use if wanted. This was the first soccer arcade I found that offered online features through Konami’s e-Amusement network, although there might have been others.</p>
<p></p>
<p>Way back in 2011, I also came across this unique game at a trade show called <em>Break Away Robot Soccer</em>, but I never saw another example of this, so if it was mass produced, it didn’t get much attention over here.</p>
<p></p>
<p>Aside from these, there wasn’t much to discuss about soccer arcade games from 2000-2018, aside from the occasional redemption piece or pinball machine (very occasional in terms of pinball – I only know of <em><a href="https://www.ipdb.org/machine.cgi?id=4459">Striker Extreme</a></em> by Stern). There was also ICE’s re-release of <a href="https://youtu.be/QGH_4FcE9ho"><em>Super Kixx</em></a> (which had first popped up in 1990) back in 2019 that brought “bubble soccer” to the modern arcade, although I’m not sure how popular that ultimately was. I’m also unsure when the first “kicker” games came along, which are an alternative to boxer arcade systems; you just kick a soccer ball attached to a metal arm as hard as you can to show off your strength. These also often come in “Combo Boxers” that have both.</p>
<p><a href="https://arcadeheroes.com/2018/09/12/gti-asia-china-expo-2018-now-underway-unis-unveils-multiplayer-soccer-video-game/">In 2018, that all changed</a> as Chinese developer UNIS unveiled <a href="https://arcadeheroes.com/2019/03/15/new-release-fantasy-soccer-unis/"><em>Fantasy Soccer</em></a>, a modern interpretation on Namco’s <em>World Kicks</em> that featured a similar control scheme, while coming with their own software. This was made in four &amp;<a href="https://arcadeheroes.com/2019/09/21/unis-producing-a-2-player-version-of-fantasy-soccer/"> two player</a> editions, and while it was only on the market for a couple of years, recently UNIS did a new production run for Dave &amp; Busters so that they could have a soccer video game this summer (celebrating the World Cup). It’s a slight shame they didn’t seek out or commission a new-new game for that, but clearly they liked this one enough to bring it back.</p>
<p></p>
<p>Not long after that, in 2019, a Swedish company by the name of Kynoa SA created a VR foosball arcade game that they called <em><a href="https://arcadeheroes.com/2019/11/05/barron-games-teams-up-with-kynoa-for-koliseum-soccer-vr/">Koliseum Soccer VR</a></em>. This was at IAAPA 2025, where it came in the NOVa cabinet you see here. It’s essentially foosball, but you get to choose from numerous arenas, and there are things to spice up the gameplay that physical foosball can’t do, like power-ups.</p>
<p></p>
<p>A couple of years ago, we did additionally see the arrival of <em>Subsoccer Arcade, </em>which is not a video game, but has been quite popular as a two-player game that pits a pair of people against each other in a match of mini-soccer. This is currently being distributed by Sega Amusements, who have been promoting it plenty since the latter half of last year:</p>
<p></p>
<p>Then at Amusement Expo 2026, JET Games USA showed off their new videmption game, <em>World Football Frenzy</em> (which I think can work as a non-redemption game, but I doubt that many locations would bother), while ICE had an updated version of their non-video redemption game, <em>World Football Pro Tourney Edition</em>. It seems like this format of football arcade game is the one that’s enduring most now, but it would be cool to see a return to proper joystick ones someday.</p>
<p></p>

<p>So that catches us up on the state of the soccer/football arcade. Which of these is your favorite? Would you like to see more fill up the genre, or do you prefer it stick to redemption?</p>
