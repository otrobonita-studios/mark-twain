<body>
<main aria-label="Nearby bus routes" id="app">


<section aria-label="Bus route search" class="bottom-sheet">
<button aria-expanded="false" class="sheet-toggle" id="sheet-toggle" type="button">

<span class="sheet-toggle-copy">
<strong id="sheet-count">Nearby routes</strong>
<span id="sheet-toggle-label">Move the map to search</span>
</span>

</button>
<div class="sheet-content" hidden="" id="sheet-content">
<div class="radius-row">
<span>Search radius</span>
<div aria-label="Search radius" class="radius-options" role="group">
<button class="radius-option" data-radius="200" type="button">200 m</button>
<button class="radius-option active" data-radius="500" type="button">500 m</button>
<button class="radius-option" data-radius="1000" type="button">1 km</button>
</div>
</div>
<div aria-live="polite" class="results" id="results">
<div class="results-empty">
<span class="empty-symbol">⌖</span>
<strong>Allow location to find nearby buses</strong>
<p>Or move the map to search somewhere else.</p>
</div>
</div>
</div>
<div class="route-detail" hidden="" id="route-detail">
<button aria-label="Back to all nearby routes" class="route-detail-back" id="route-detail-back" type="button"><span aria-hidden="true" class="back-icon">←</span><span>All nearby routes</span></button>

</div>
</section>
</main>
</body>
